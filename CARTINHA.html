<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>uma cartinha pra você</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  :root { --navy: #1c2a6e; --rosa: #ff8fb8; --rosa2: #ffd0e4; --creme: #fff6e0; --rosaescuro: #e0457b; }
  body {
    font-family: 'VT323', 'Courier New', monospace;
    background: linear-gradient(#6ec6ff 0 25%, #5ab4fa 25% 50%, #459ff0 50% 75%, #3388e0 75% 100%);
    display: flex; align-items: center; justify-content: center;
  }
  img { image-rendering: pixelated; }
  @keyframes pisca { 50% { opacity: 0; } }
  @keyframes pula  { 0% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

  .nuvem { position: fixed; left: -300px; z-index: 0; animation: nuvem linear infinite; }
  @keyframes nuvem { to { transform: translateX(calc(100vw + 400px)); } }

  .chao {
    position: fixed; left: 0; right: 0; bottom: 0; height: 80px; z-index: 2;
    background:
      linear-gradient(var(--navy) 0 4px, transparent 4px),
      linear-gradient(#a6e89a 0 14px, #86d67f 14px 100%);
  }

  .coracao { position: fixed; top: -40px; z-index: 3; pointer-events: none; animation: cair linear forwards; }
  @keyframes cair { to { transform: translate(var(--dx), 115vh); } }

  .poke { position: fixed; bottom: 58px; z-index: 4; animation: pula 1s steps(1) infinite; pointer-events: none; }
  .snorlax { left: 1%;  width: min(25vw, 190px); }

  .cena { position: relative; z-index: 5; padding-top: 20px; transition: transform .4s steps(4); }
  .cena.sumir { transform: scale(0); }
  .envelope { position: relative; width: 280px; height: 190px; cursor: pointer; animation: pula 1.2s steps(1) infinite; }
  .envelope svg { position: absolute; left: 0; top: 0; width: 100%; shape-rendering: crispEdges; overflow: visible; }
  .corpo { height: 190px; filter: drop-shadow(8px 8px 0 rgba(28,42,110,.35)); }
  .aba { height: 110px; transform-origin: top; transition: transform .5s steps(5); z-index: 3; }
  .envelope.aberto .aba { transform: rotateX(180deg); }
  .selo { position: absolute; left: 50%; top: 76px; width: 54px; margin-left: -27px; z-index: 4; }
  .envelope.aberto .selo { visibility: hidden; }
  .raios { --r: 0deg; position: absolute; width: 90px; top: -34px; z-index: 7; transform: rotate(var(--r)); animation: pulsa .8s steps(1) infinite; }
  .raios.esq { --r: -62deg; left: -74px; }
  .raios.dir { --r: 62deg;  right: -74px; }
  @keyframes pulsa { 50% { transform: rotate(var(--r)) scale(1.12); } }
  @media (max-width: 520px) { .raios { width: 62px; } .raios.esq { left: -26px; } .raios.dir { right: -26px; } }
  .dica {
    margin-top: 34px; text-align: center; color: #fff;
    font: 12px 'Press Start 2P', monospace; text-shadow: 3px 3px 0 var(--navy);
    animation: pisca 1s steps(1) infinite;
  }

  .carta {
    position: fixed; top: 46%; left: 50%; z-index: 6; width: min(90vw, 460px);
    background: var(--creme); border: 4px solid var(--navy); box-shadow: 8px 8px 0 rgba(28,42,110,.4);
    transform: translate(-50%, -50%) scale(0); visibility: hidden; transition: transform .5s steps(6);
  }
  .carta.mostrar { transform: translate(-50%, -50%) scale(1); visibility: visible; }
  .barra {
    background: linear-gradient(90deg, #4aa3ff, #8fd0ff); color: #fff; border-bottom: 4px solid var(--navy);
    font: 10px 'Press Start 2P', monospace; padding: 8px 10px; display: flex; justify-content: space-between; align-items: center;
    text-shadow: 2px 2px 0 var(--navy);
  }
  .barra i { display: inline-block; width: 12px; height: 12px; background: var(--rosa2); border: 2px solid var(--navy); margin-left: 4px; }
  .conteudo {
    padding: 22px 22px 18px; text-align: center;
    background-image: repeating-linear-gradient(transparent 0 31px, rgba(255,143,184,.28) 31px 32px);
  }
  .conteudo h1 { font: 14px/1.7 'Press Start 2P', monospace; color: var(--rosaescuro); margin-bottom: 14px; }
  .conteudo p { font-size: 26px; line-height: 32px; color: #4a3a6a; min-height: 128px; white-space: pre-line; }
  .cursor { display: inline-block; width: 10px; height: 20px; margin-left: 3px; background: var(--rosaescuro); animation: pisca .8s steps(1) infinite; }
  .assinatura { margin-top: 10px; font: 11px/1.8 'Press Start 2P', monospace; color: var(--rosaescuro); }
  .barra .bx { width: 22px; height: 22px; margin-left: 4px; cursor: pointer; background: var(--rosa); border: 2px solid var(--navy); color: #fff; font: 9px 'Press Start 2P', monospace; text-shadow: none; }
  .conteudo button {
    margin: 16px 4px 0; padding: 9px 14px; cursor: pointer; font: 10px 'Press Start 2P', monospace; color: #fff;
    background: var(--rosa); border: 3px solid var(--navy); box-shadow: 4px 4px 0 var(--navy); text-shadow: 2px 2px 0 var(--navy);
  }
  .conteudo button:active { transform: translate(4px, 4px); box-shadow: none; }
</style>
</head>

  <div class="barra"><span id="janela"></span><span><i></i><button class="bx" id="fecharX" aria-label="fechar">✕</button></span></div>
  <div class="conteudo">
    <h1 id="titulo"></h1>
    <p><span id="texto"></span><i class="cursor"></i></p>
    <div class="assinatura" id="assinatura"></div>
    <button id="reler">▶ ler de novo</button>
    <button id="fechar">✕ fechar</button>
  </div>
</div>

<script>
  const CONFIG = {
    janela:     "cartinha.txt",
    titulo:     "Para você meu amoreco ♥",
    mensagem:   "Você é a pessoa mais especial do mundo sabia?\nSó de pensar em você, eu já me sinto tão feliz\neu te amo infinitamente.\nObrigada por existir!",
    assinatura: "Feliz um ano e dez meses com todo meu carinho sua manuzinha ♥"
  };


  const $ = id => document.getElementById(id);

  function pixel(rows, pal) {
    let r = "";
    rows.forEach((row, y) => [...row].forEach((c, x) => {
      if (pal[c]) r += `<rect x="${x}" y="${y}" width="1" height="1" fill="${pal[c]}"/>`;
    }));
    return "data:image/svg+xml;utf8," + encodeURIComponent(
      `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${rows[0].length} ${rows.length}" shape-rendering="crispEdges">${r}</svg>`);
  }
  const CORACAO = [
    ".ooo.ooo.",
    "opwpopppo",
    "opppppppo",
    "opppppppo",
    ".opppppo.",
    "..opppo..",
    "...opo...",
    "....o...."
  ];
  const PALETAS = [
    { o: "#c2306a", p: "#ff7fae", w: "#fff" },
    { o: "#d9577f", p: "#ffc2dc", w: "#fff" },
    { o: "#2f5fbf", p: "#cfeaff", w: "#fff" },
    { o: "#e0457b", p: "#ff9ec8", w: "#fff" }
  ];
  const CORACOES = PALETAS.map(p => pixel(CORACAO, p));
  $("selo").src = CORACOES[0];

  const NUVEM = [
    "......wwww........",
    "....wwwwwwww..ww..",
    "..wwwwwwwwwwwwwwww",
    "wwwwwwwwwwwwwwwwww",
    ".bbbbbbbbbbbbbbb.."
  ];
  const NUVEM_SRC = pixel(NUVEM, { w: "#ffffff", b: "#cfe9ff" });
  [[8, 12, 70], [26, 9, 95], [14, 14, 120]].forEach(([top, px, dur], i) => {
    const n = new Image();
    n.className = "nuvem"; n.src = NUVEM_SRC;
    n.style.cssText = `top:${top}%;width:${px * 18}px;animation-duration:${dur}s;animation-timing-function:steps(${dur * 4});animation-delay:-${i * 25}s`;
    document.body.appendChild(n);
  });


  function coracao() {
    const img = new Image();
    img.className = "coracao";
    img.src = CORACOES[Math.floor(Math.random() * CORACOES.length)];
    const dur = 5 + Math.random() * 5;
    img.style.cssText = `width:${[18, 27, 36][Math.floor(Math.random() * 3)]}px;left:${Math.random() * 100}vw;` +
      `animation-duration:${dur}s;animation-timing-function:steps(${Math.round(dur * 8)});--dx:${Math.random() * 120 - 60}px`;
    document.body.appendChild(img);
    setTimeout(() => img.remove(), dur * 1000);
  }
  setInterval(coracao, 350);

  // ---- textos ----
  $("janela").textContent = CONFIG.janela;
  $("titulo").textContent = CONFIG.titulo;
  $("assinatura").textContent = CONFIG.assinatura;

  let timer;
  function digitar() {
    clearInterval(timer);
    const el = $("texto"), letras = Array.from(CONFIG.mensagem); let i = 0;
    el.textContent = "";
    timer = setInterval(() => {
      el.textContent += letras[i++];
      if (i >= letras.length) clearInterval(timer);
    }, 55);
  }

  $("envelope").addEventListener("click", () => {
    const env = $("envelope");
    if (env.classList.contains("aberto")) return;
    env.classList.add("aberto");
    document.querySelector(".dica").style.visibility = "hidden";
    setTimeout(() => $("cena").classList.add("sumir"), 650);
    setTimeout(() => {
      $("carta").classList.add("mostrar"); digitar();
      for (let i = 0; i < 25; i++) setTimeout(coracao, i * 70);
    }, 950);
  });

  $("reler").addEventListener("click", () => {
    $("carta").classList.remove("mostrar");
    setTimeout(() => { $("carta").classList.add("mostrar"); digitar(); }, 600);
  });
  function fechar() {
    clearInterval(timer);
    $("carta").classList.remove("mostrar");
    setTimeout(() => {
      $("envelope").classList.remove("aberto");
      $("cena").classList.remove("sumir");
      document.querySelector(".dica").style.visibility = "visible";
    }, 500);
  }
  $("fechar").addEventListener("click", fechar);
  $("fecharX").addEventListener("click", fechar);
  document.addEventListener("keydown", e => { if (e.key === "Escape") fechar(); });
</script>
</body>
</html>
